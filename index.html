<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-Wire Start/Stop Trainer — 24 VDC</title>
<!--
  24 VDC THREE-WIRE START/STOP TRAINER
  ------------------------------------------------------------------
  Single file, no dependencies. Open index.html in any modern browser.

  File map
    <style>   theme + layout + SVG state classes
    <script>
      1. SIM CORE   pure circuit model (no DOM). Nodes, edges, solver.
      2. SCHEMATIC  SVG built from the WIRES / CONTACTS / TERMS tables.
      3. CONTENT    FAULTS, SCENARIOS, TRACE_STEPS, TERMMAP (edit these
                    tables to add faults, quiz scenarios or lesson steps).
      4. UI         render(), control panel, multimeter, tabs.
-->
<style>
:root{
  --bg:#0d1014; --card:#151a21; --card2:#1b222b; --line:#28313d;
  --text:#e7edf4; --muted:#8a97a8;
  --blue:#29a9ff; --red:#ff4d4f; --green:#2fd67b; --amber:#ffb020; --gold:#ffd24a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{height:100vh;display:grid;grid-template-rows:auto 1fr;background:var(--bg);color:var(--text);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#171d25,#12161c)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 small{color:var(--muted);font-weight:400;margin-left:8px}
.leds{margin-left:auto;display:flex;gap:14px;font:600 11px var(--mono);color:var(--muted)}
.leds span{display:flex;align-items:center;gap:6px}
.led{width:10px;height:10px;border-radius:50%;background:#2a323d;box-shadow:inset 0 0 2px #000;transition:all .15s}
.led.g{background:var(--green);box-shadow:0 0 8px var(--green)}
.led.r{background:var(--red);box-shadow:0 0 8px var(--red)}
.led.b{background:var(--blue);box-shadow:0 0 8px var(--blue)}

main{display:grid;grid-template-columns:3fr 2fr;gap:14px;padding:14px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.left{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.schem{flex:1;min-height:0;padding:6px}
.schem svg{width:100%;height:100%;display:block;user-select:none}
.statusbar{border-top:1px solid var(--line);padding:9px 14px;background:var(--card2);border-radius:0 0 12px 12px}
#status{font-weight:600}
#log{color:var(--muted);font:12px var(--mono);margin-top:3px;min-height:34px}
#log div:first-child{color:#c3cedb}
.right{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding-right:2px}
.card h2{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0;
  padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card .body{padding:12px 14px}

/* ---------- control panel ---------- */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pb{width:68px;height:68px;border-radius:50%;border:3px solid #0008;color:#fff;font:700 12px var(--mono);cursor:pointer;
  box-shadow:0 5px 0 #0009,inset 0 2px 6px #fff3;transition:transform .06s,box-shadow .06s,filter .1s;touch-action:none}
.pb.start{background:radial-gradient(circle at 35% 30%,#5df0a0,#149a52)}
.pb.stop{background:radial-gradient(circle at 35% 30%,#ff8a8b,#c2181b)}
.pb.down{transform:translateY(4px);box-shadow:0 1px 0 #0009,inset 0 2px 8px #0006;filter:brightness(1.2)}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
  font:600 12px inherit;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:#232c37;border-color:#3a4656}
.btn.attn{border-color:var(--red);color:#ffb3b4;animation:pulse 1s infinite}
.btn.primary{background:#103a5a;border-color:#1c5f93}
.btn:disabled{opacity:.45;cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 3px #ff4d4f33}}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.switch input{appearance:none;width:44px;height:24px;border-radius:12px;background:#2a323d;position:relative;cursor:pointer;
  transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfd8e3;transition:left .15s}
.switch input:checked{background:var(--blue)}
.switch input:checked::after{left:23px}
.faults{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.faults label{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--card2);cursor:pointer;font-size:12.5px}
.faults label.on{border-color:var(--red);background:#2a1618;color:#ffc9ca}
.faults input{accent-color:var(--red)}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font:600 11px var(--mono);
  color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.keys{color:var(--muted);font:11px var(--mono);margin-top:8px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--card2)}

/* ---------- multimeter ---------- */
.dmm{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:stretch}
.lcd{min-width:190px;background:#0a1410;border:1px solid #1d3a2c;border-radius:8px;padding:8px 12px;text-align:right;
  box-shadow:inset 0 0 18px #000}
.lcd .big{font:700 34px/1 var(--mono);color:#6dffb0;text-shadow:0 0 10px #2fd67b88;white-space:nowrap}
.lcd .big.warn{color:var(--amber);text-shadow:0 0 10px #ffb02088;font-size:24px;line-height:34px}
.lcd .unit{font:600 11px var(--mono);color:#4fae7c;margin-top:4px}
.dmmside{display:flex;flex-direction:column;gap:6px;justify-content:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn.sel{background:#103a5a;border-color:var(--blue);color:#cfeaff}
.leads{font:12px var(--mono);color:var(--muted)}
.leads b.r{color:#ff7b7d}.leads b.k{color:#d5dde7}
#meterHint{margin-top:8px;color:#b9c6d4;font-size:12.5px}

/* ---------- tabs ---------- */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 6px;
  font:600 12.5px inherit;cursor:pointer}
.tabs button.sel{color:var(--text);border-bottom-color:var(--blue)}
.pane{display:none;padding:12px 14px}.pane.sel{display:block}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;padding:8px 10px;cursor:pointer;background:var(--card2)}
.steps li::before{content:counter(s);display:inline-block;width:20px;height:20px;border-radius:50%;background:#2a323d;
  text-align:center;font:700 11px/20px var(--mono);margin-right:8px}
.steps li.sel{border-color:var(--gold);background:#272213}
.steps li.sel::before{background:var(--gold);color:#000}
.steps li p{margin:6px 0 0 28px;color:#c9d3df;display:none}
.steps li.sel p{display:block}
.steps li .try{color:var(--gold)}
.nav{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.nav .sp{margin-left:auto;color:var(--muted);font:12px var(--mono)}
.scn{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--card2);overflow:hidden}
.scn>button{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 10px;font:600 13px inherit;cursor:pointer}
.scn.solved>button::after{content:" ✓";color:var(--green)}
.scn .in{display:none;padding:0 10px 10px}
.scn.open .in{display:block}.scn.open{border-color:#3a4656}
.scn .clue{color:#c9d3df;margin:0 0 8px}
.opts{display:grid;gap:5px}
.opts .btn{text-align:left;font-weight:500}
.opts .btn.ok{border-color:var(--green);background:#11281c;color:#b9f5d4}
.opts .btn.no{border-color:var(--red);background:#2a1618;color:#ffc9ca}
.fb{margin:8px 0;padding:8px 10px;border-radius:8px;font-size:12.5px;display:none}
.fb.ok{display:block;background:#11281c;border:1px solid #1f5a3b}
.fb.no{display:block;background:#2a1618;border:1px solid #5d2426}
.myst{border:1px dashed #3a4656;border-radius:8px;padding:10px;margin-bottom:12px}
.myst select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;max-width:100%}
table.tm{width:100%;border-collapse:collapse;font-size:12.5px}
table.tm th{text-align:left;color:var(--muted);font:600 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;padding:4px 6px}
table.tm td{border-top:1px solid var(--line);padding:6px;vertical-align:middle}
table.tm .note{color:var(--muted);font-size:11.5px}
.tag{font:700 10px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.num{font:700 13px var(--mono);color:var(--amber);display:inline-block;min-width:30px}
table.tm input{width:44px;background:#0d1014;border:1px solid var(--line);border-radius:6px;color:var(--text);
  font:700 13px var(--mono);padding:4px;text-align:center;margin-right:4px}
table.tm input.ok{border-color:var(--green);color:var(--green)}
table.tm input.no{border-color:var(--red);color:var(--red)}
.rules{color:#c9d3df;font-size:12.5px;margin:10px 0 0;padding-left:18px}
.rules li{margin-bottom:3px}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:10;max-width:290px;background:#0b0e12;border:1px solid #3a4656;border-radius:8px;padding:8px 10px;
  font-size:12.5px;color:#dbe4ee;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px #000a}
#tip.show{opacity:1}

/* ---------- SVG schematic ---------- */
.wire,.sym{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .18s}
.v24{stroke:var(--blue)} .v0{stroke:#5d6979} .vf{stroke:#3d4654} .vx{stroke:#8a97a8}
.blade{transition:transform .14s ease-out,stroke .18s}
.blade.open{transform:rotate(-28deg)}
.act{transition:transform .08s} .act.pressed{transform:translateX(6px)}
.mech{stroke:#6b7888;stroke-width:1.5;stroke-dasharray:3 3;fill:none}
.flow{fill:none;stroke:#e4f6ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:3 11;opacity:0;pointer-events:none;
  animation:flow .45s linear infinite;transition:opacity .15s}
.flow.on{opacity:1}
@keyframes flow{to{stroke-dashoffset:-14}}
.coil{fill:#1b222b;stroke:#8a97a8;stroke-width:3;transition:all .18s}
.coil.on{fill:#4a1517;stroke:var(--red);filter:drop-shadow(0 0 9px #ff4d4fcc)}
.coiltxt{fill:var(--text);font:700 17px var(--mono);text-anchor:middle;pointer-events:none}
.lbl{fill:var(--text);font:700 14px "Segoe UI",sans-serif}
.sub{fill:var(--muted);font:11px "Segoe UI",sans-serif}
.tlabel{fill:var(--amber);font:700 12px var(--mono);pointer-events:none}
.hidenums .tlabel{opacity:0}
.dot{fill:#8a97a8}
.term{cursor:crosshair}
.term circle.pin{fill:var(--bg);stroke:#c3cedb;stroke-width:2;transition:all .12s}
.term:hover circle.pin{stroke:var(--gold);fill:#3a3214}
.hit{fill:transparent;cursor:pointer}
.fusebody{fill:#1b222b;stroke:#8a97a8;stroke-width:2}
.fuse.blown .fusebody{stroke:var(--red)} .fuse.blown .link{opacity:0}
.fuse.blown .burn{opacity:1} .burn{opacity:0;fill:var(--red);font:700 13px var(--mono);text-anchor:middle}
.dsym{transition:transform .25s,opacity .2s;transform-origin:180px 605px}
.dsym.rev{transform:rotate(180deg)} .dsym.gone{opacity:.2}
.dtri{fill:#8a97a8;stroke:#8a97a8;stroke-width:2;stroke-linejoin:round}
.psu{fill:#1b222b;stroke:#8a97a8;stroke-width:2;cursor:pointer}
.motor{fill:#1b222b;stroke:#8a97a8;stroke-width:3;transition:all .2s}
.motor.run{stroke:var(--green);filter:drop-shadow(0 0 8px #2fd67baa)}
.rotor{transform-origin:790px 605px;stroke:#8a97a8;stroke-width:3;stroke-linecap:round}
.rotor.run{animation:spin .7s linear infinite;stroke:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
.mark{display:none;pointer-events:none}.mark.on{display:block}
.mark circle{fill:var(--bg);stroke:var(--red);stroke-width:2}
.mark path{stroke:var(--red);stroke-width:2.5;stroke-linecap:round}
.probe{fill:none;stroke-width:3;pointer-events:none;display:none}
.probe.on{display:block}
.probe.red{stroke:var(--red)} .probe.black{stroke:#e7edf4;stroke-dasharray:4 3}
/* highlight classes used by Finger Trace (gold) and What-If (red) */
.wire.trace,.trace .sym,.trace .coil,.trace .fusebody,.trace .dtri{stroke:var(--gold)!important;filter:drop-shadow(0 0 5px #ffd24acc)}
.wire.culprit,.culprit .sym,.culprit .coil,.culprit .fusebody,.culprit .dtri,.culprit .psu{stroke:var(--red)!important;
  filter:drop-shadow(0 0 6px #ff4d4f);animation:blink .7s infinite}
@keyframes blink{50%{opacity:.45}}

@media (max-width:1000px){
  body{height:auto;display:block}
  main{grid-template-columns:1fr}
  .schem{height:78vh}
  .right{overflow:visible}
}
</style>
</head>
<body>
<header>
  <h1>3-Wire Start/Stop Trainer <small>24 VDC control · I&amp;C troubleshooting practice</small></h1>
  <div class="leds">
    <span><i class="led" id="led_pwr"></i>24V</span>
    <span><i class="led" id="led_f1"></i>F1</span>
    <span><i class="led" id="led_ol"></i>OL</span>
    <span><i class="led" id="led_cr"></i>CR</span>
    <span><i class="led" id="led_m"></i>M</span>
  </div>
</header>

<main>
  <!-- LEFT 60%: schematic (SVG contents are generated by buildSchematic()) -->
  <section class="left card">
    <div class="schem"><svg id="svg" viewBox="20 20 830 730" preserveAspectRatio="xMidYMid meet" aria-label="Three-wire start/stop schematic"></svg></div>
    <div class="statusbar"><div id="status"></div><div id="log"></div></div>
  </section>

  <!-- RIGHT 40%: control panel, multimeter, lessons -->
  <section class="right">
    <div class="card">
      <h2>Control Panel</h2>
      <div class="body">
        <div class="ctl">
          <button class="pb start" id="btnStart" data-tip="START — momentary. Hold it down; CR should seal itself in so the circuit stays on when you let go.">START</button>
          <button class="pb stop" id="btnStop" data-tip="STOP — momentary NC. Opens the rung and drops out CR.">STOP</button>
          <div style="display:flex;flex-direction:column;gap:7px">
            <label class="switch" data-tip="Main 24 VDC supply. Switch OFF before using the continuity range."><input type="checkbox" id="swPower" checked>24 V supply</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn" id="btnReset" data-tip="Reset the overload relay (re-closes 95/96). The motor must NOT restart by itself.">Reset OL</button>
              <button class="btn" id="btnTrip" data-tip="Simulate a motor overload: the OL relay trips and opens 95/96.">Trip OL</button>
              <button class="btn" id="btnFuse" data-tip="Fit a new control fuse F1.">Replace F1</button>
            </div>
          </div>
        </div>
        <div class="keys">Keys: hold <kbd>S</kbd> start · hold <kbd>X</kbd> stop · <kbd>R</kbd> reset OL · <kbd>P</kbd> power</div>
        <div class="sechead"><span>Fault injection</span><button class="btn" id="btnClear">Clear all</button></div>
        <div class="faults" id="faults"></div>
      </div>
    </div>

    <div class="card">
      <h2>Multimeter</h2>
      <div class="body">
        <div class="dmm">
          <div class="lcd"><div class="big" id="lcdBig">– – –</div><div class="unit" id="lcdUnit">V DC</div></div>
          <div class="dmmside">
            <div class="seg">
              <button class="btn sel" id="modeV" data-tip="DC volts. Red lead goes where you click; black lead sits on 24 V− unless you move it.">V ⎓</button>
              <button class="btn" id="modeC" data-tip="Continuity / ohms. Click two terminals. Supply must be OFF.">Ω ·))</button>
              <button class="btn" id="moveBlack" data-tip="Next terminal click places the BLACK lead (to read across a device).">Move black</button>
              <button class="btn" id="blackCom" data-tip="Put the black lead back on the 24 V− rail.">Black → 24V−</button>
            </div>
            <div class="leads" id="leads"></div>
          </div>
        </div>
        <div id="meterHint"></div>
      </div>
    </div>

    <div class="card">
      <div class="tabs" id="tabs">
        <button data-tab="trace" class="sel">Finger Trace</button>
        <button data-tab="whatif">What-If</button>
        <button data-tab="map">Blindfold Terminal Map</button>
      </div>
      <div class="pane sel" id="pane_trace"></div>
      <div class="pane" id="pane_whatif"></div>
      <div class="pane" id="pane_map"></div>
    </div>
  </section>
</main>
<div id="tip"></div>

<script>
"use strict";
/* =====================================================================
   1. SIM CORE — pure circuit model, no DOM access.
   ---------------------------------------------------------------------
   The circuit is a small graph:
     NODES       every terminal / junction.
     hardEdges   wires, the fuse and contacts (zero-ohm when closed).
     softEdges   coils (they pass a meter reading but drop the voltage).
   solve() floods 24 V out from 'P' and 0 V out from 'N' along hard
   edges, then lets any leftover island "see" a potential through a
   coil — that is what makes the classic readings come out right
   (24 V across an open contact, 24 V on A2 with a lost neutral, ...).

   Topology (matches the drawing):
     P ─ F1 ─ OL 95/96 ─ STOP 11/12 ─ J2 ─┬─ START 13/14 ─┬─ J3 ─ CR A1/A2 ─ N
                                          └─ CR 13/14 ────┘   ├─ diode K/A (across coil)
                                                              └─ CR 23/24 ─ M A1/A2 ─ N

   TO ADD A FAULT: add a flag to state.faults, use it in hardEdges()
   or softEdges(), then describe it in the FAULTS table (section 3).
   ===================================================================== */
/*<SIM-CORE>*/
const Sim = (() => {
  const state = {
    power: true, fuseBlown: false, olTripped: false,
    startPressed: false, stopPressed: false,
    crPicked: false,   // CR armature position (follows the coil after a short delay)
    mPicked: false,    // M contactor armature position
    faults: {
      stopWire: false, sealOpen: false, diodeRev: false, diodeOpen: false, crCoilOpen: false,
      neutralOpen: false, c2324Open: false, mCoilOpen: false, stopWelded: false, startStuck: false
    }
  };
  const NODES = ['P','F1a','F1b','OL95','OL96','ST11','ST12','J2','PB13','PB14','CR13','CR14',
                 'J3','CRA1','CRA2','DK','DA','CR23','CR24','MA1','MA2','N'];
  const R_CR = 650, R_M = 180;   // coil resistances shown on the ohms range

  // [nodeA, nodeB, isConducting]
  function hardEdges(s) {
    const f = s.faults;
    return [
      ['P','F1a', true],
      ['F1a','F1b', !s.fuseBlown],                           // fuse F1
      ['F1b','OL95', true],
      ['OL95','OL96', !s.olTripped],                         // OL NC 95/96
      ['OL96','ST11', !f.stopWire],                          // wire OL → STOP
      ['ST11','ST12', !s.stopPressed || f.stopWelded],       // STOP NC 11/12
      ['ST12','J2', true],
      ['J2','PB13', true],
      ['PB13','PB14', s.startPressed || f.startStuck],       // START NO 13/14
      ['PB14','J3', true],
      ['J2','CR13', true],
      ['CR13','CR14', s.crPicked && !f.sealOpen],            // seal-in NO 13/14
      ['CR14','J3', true],
      ['J3','CRA1', true], ['J3','DK', true], ['J3','CR23', true],
      ['CR23','CR24', s.crPicked && !f.c2324Open],           // CR NO 23/24
      ['CR24','MA1', true],
      ['MA2','N', true],
      ['DA','CRA2', true],
      ['CRA2','N', !f.neutralOpen]                           // CR A2 → 24 V−
    ].filter(e => e[2]);
  }
  // [nodeA, nodeB, ohms]
  function softEdges(s) {
    const e = [];
    if (!s.faults.crCoilOpen) e.push(['CRA1','CRA2', R_CR]);
    if (!s.faults.mCoilOpen)  e.push(['MA1','MA2', R_M]);
    return e;
  }
  function adjacency(edges, directed) {
    const adj = {}; NODES.forEach(n => adj[n] = []);
    edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    (directed || []).forEach(([a, b]) => adj[a].push(b));
    return adj;
  }
  function flood(starts, adj) {
    const seen = new Set(starts), q = [...starts];
    while (q.length) { const n = q.pop(); for (const m of adj[n]) if (!seen.has(m)) { seen.add(m); q.push(m); } }
    return seen;
  }

  /* Returns { V:{node:volts|null}, crCoil, mCoil, short }.
     V === null means the node is floating (no path to either rail). */
  function solve() {
    const s = state, V = {};
    const hard = hardEdges(s), soft = softEdges(s);
    const adj = adjacency(hard);
    if (!s.power) { NODES.forEach(n => V[n] = 0); return { V, crCoil: false, mCoil: false, short: false }; }

    // A reversed diode conducts from the A1 side to the A2 side: a dead short across the coil.
    const adjHot = s.faults.diodeRev ? adjacency(hard, [['DK','DA']]) : adj;
    const hot = flood(['P'], adjHot);
    if (hot.has('N')) { NODES.forEach(n => V[n] = null); return { V, crCoil: false, mCoil: false, short: true }; }
    const zero = flood(['N'], adj);
    NODES.forEach(n => V[n] = hot.has(n) ? 24 : zero.has(n) ? 0 : null);

    // Islands that touch neither rail directly take their potential through a coil.
    for (let pass = 0; pass < 4; pass++) {
      let changed = false; const seen = new Set();
      for (const n of NODES) {
        if (V[n] !== null || seen.has(n)) continue;
        const isl = flood([n], adj); isl.forEach(x => seen.add(x));
        const pots = [];
        for (const [a, b] of soft) {
          if (isl.has(a) && !isl.has(b) && V[b] !== null) pots.push(V[b]);
          if (isl.has(b) && !isl.has(a) && V[a] !== null) pots.push(V[a]);
        }
        if (pots.length) { const v = pots.reduce((x, y) => x + y, 0) / pots.length; isl.forEach(x => V[x] = v); changed = true; }
      }
      if (!changed) break;
    }
    const across = (a, b) => (V[a] === null || V[b] === null) ? 0 : V[a] - V[b];
    return {
      V, short: false,
      crCoil: !s.faults.crCoilOpen && across('CRA1','CRA2') >= 18,   // pick-up threshold
      mCoil:  !s.faults.mCoilOpen  && across('MA1','MA2')  >= 18
    };
  }

  /* One state-machine step. Returns true if anything changed.
     Order matters: fuse first, then CR, then M — one event per step so
     the UI can animate the sequence. */
  function step() {
    const r = solve();
    if (r.short) { state.fuseBlown = true; return true; }
    if (r.crCoil !== state.crPicked) { state.crPicked = r.crCoil; return true; }
    if (r.mCoil !== state.mPicked) { state.mPicked = r.mCoil; return true; }
    return false;
  }
  function settle() { let i = 0; while (step() && ++i < 20); return solve(); }

  /* Which wire groups carry current (drives the flow animation). */
  function flows(r) {
    const s = state, f = s.faults, tot = r.crCoil || r.mCoil;
    return {
      tot,
      start: tot && (s.startPressed || f.startStuck),
      seal:  tot && s.crPicked && !f.sealOpen,
      cr: r.crCoil, m: r.mCoil
    };
  }

  /* Resistance between two nodes (Infinity = open). Supply is treated as open. */
  function continuity(a, b) {
    const edges = hardEdges(state).map(e => [e[0], e[1], 0.05]).concat(softEdges(state));
    const dist = {}; NODES.forEach(n => dist[n] = Infinity); dist[a] = 0;
    const done = new Set();
    for (;;) {
      let u = null;
      for (const n of NODES) if (!done.has(n) && dist[n] < Infinity && (u === null || dist[n] < dist[u])) u = n;
      if (u === null) break;
      done.add(u);
      for (const [x, y, w] of edges) {
        const v = x === u ? y : y === u ? x : null;
        if (v && dist[u] + w < dist[v]) dist[v] = dist[u] + w;
      }
    }
    return dist[b];
  }

  return { state, NODES, solve, step, settle, flows, continuity };
})();

];
const MYSTERY_POOL = ['stopWire', 'sealOpen', 'diodeRev', 'crCoilOpen', 'neutralOpen', 'c2324Open', 'mCoilOpen', 'stopWelded', 'startStuck'];

/* FINGER TRACE — each step highlights `hl` (ids of wires "w_…" or components "c_…"). */

const TERMMAP = [

/* =====================================================================
   4. UI
   ===================================================================== */
let mystery = null;           // key of the hidden fault while a mystery challenge is running
let lastR = null, relayTimer = null;
const logLines = [];
const meter = { mode: 'V', red: null, black: 'TPN', next: 'red' };

function log(msg) { logLines.unshift(msg); logLines.length = Math.min(logLines.length, 2); }

/* Re-solve, redraw, and schedule the next relay movement if a coil and
   its armature disagree. This loop IS the state machine's clock. */
function update() {
  let r = Sim.solve();
  if (r.short) {
    S_.fuseBlown = true;
    log(mystery ? 'F1 has blown.' : 'F1 blown — the reversed diode is a dead short across the coil.');
    r = Sim.solve();
  }
  render(r);
  clearTimeout(relayTimer);
  if (r.crCoil !== S_.crPicked || r.mCoil !== S_.mPicked) {
    relayTimer = setTimeout(() => {
      const was = { cr: S_.crPicked, m: S_.mPicked };
      Sim.step();
      if (!was.cr && S_.crPicked) log('CR pulls in — 13/14 and 23/24 close.');
      if (was.cr && !S_.crPicked) log(S_.faults.diodeOpen && !mystery
        ? 'CR drops out — no flyback path: several hundred volts of inductive kick across the opening contact.'
        : 'CR drops out — coil energy circulates through D1 (clamped to about −0.7 V).');
      if (!was.m && S_.mPicked) log('M contactor pulls in — motor running.');
      if (was.m && !S_.mPicked) log('M contactor drops out — motor stopped.');
      update();
    }, RELAY_MS);
  }
}

function render(r) {
  lastR = r;
  const f = S_.faults, blind = !!mystery;

  // wire colours by node voltage (suppressed in mystery mode: use the meter)
  for (const c of colorables) {
    const v = r.V[c.node];
    c.el.classList.remove('v24', 'v0', 'vf', 'vx');
    c.el.classList.add(blind ? 'vx' : v === null ? 'vf' : v >= 12 ? 'v24' : 'v0');
  }
  const fl = blind ? {} : Sim.flows(r);
  flowEls.forEach(o => o.el.classList.toggle('on', !!fl[o.key]));

  // contact blades. In mystery mode they show the *intended* position so the drawing does not give the fault away.
  const closed = {
    ol: !S_.olTripped,
    stop: blind ? !S_.stopPressed : (!S_.stopPressed || f.stopWelded),
    start: blind ? S_.startPressed : (S_.startPressed || f.startStuck),
    seal: S_.crPicked && (blind || !f.sealOpen),
    c23: S_.crPicked && (blind || !f.c2324Open)
  };
  for (const k in closed) ui.blades[k].classList.toggle('open', !closed[k]);
  ui.acts.stop.classList.toggle('pressed', S_.stopPressed);
  ui.acts.start.classList.toggle('pressed', S_.startPressed);

  ui.crCoil.classList.toggle('on', S_.crPicked || (!blind && r.crCoil));
  ui.mCoil.classList.toggle('on', S_.mPicked || (!blind && r.mCoil));
  ui.motor.classList.toggle('run', S_.mPicked);
  ui.rotor.classList.toggle('run', S_.mPicked);
  ui.motorTxt.textContent = S_.mPicked ? 'MOTOR — running' : 'MOTOR — stopped';
  ui.fuse.classList.toggle('blown', S_.fuseBlown);
  ui.psuLed.setAttribute('fill', S_.power ? '#2fd67b' : '#2a323d');
  ui.diode.classList.toggle('rev', f.diodeRev && !blind);
  ui.diode.classList.toggle('gone', f.diodeOpen && !blind);
  TERMS.DK.lab.textContent = f.diodeRev && !blind ? 'A' : 'K';
  TERMS.DA.lab.textContent = f.diodeRev && !blind ? 'K' : 'A';
  for (const k in ui.marks) ui.marks[k].classList.toggle('on', f[k] && !blind);

  // header LEDs
  $('led_pwr').className = 'led' + (S_.power ? ' b' : '');
  $('led_f1').className = 'led ' + (S_.fuseBlown ? 'r' : 'g');
  $('led_ol').className = 'led ' + (S_.olTripped ? 'r' : 'g');
  $('led_cr').className = 'led' + (S_.crPicked ? ' r' : '');
  $('led_m').className = 'led' + (S_.mPicked ? ' g' : '');

  // control panel
  $('swPower').checked = S_.power;
  $('btnStart').classList.toggle('down', S_.startPressed);
  $('btnStop').classList.toggle('down', S_.stopPressed);
  $('btnReset').classList.toggle('attn', S_.olTripped);
  $('btnFuse').classList.toggle('attn', S_.fuseBlown);
  document.querySelectorAll('#faults input').forEach(i => {
    i.checked = !blind && f[i.dataset.f]; i.disabled = blind;
    i.parentNode.classList.toggle('on', i.checked);
  });
  $('btnClear').disabled = blind;

  // status line
  let st;
  if (blind) st = `Mystery fault active — wire colours are off, use the meter.  CR ${S_.crPicked ? 'IN' : 'out'} · motor ${S_.mPicked ? 'RUNNING' : 'stopped'} · F1 ${S_.fuseBlown ? 'BLOWN' : 'ok'}`;
  else if (!S_.power) st = 'Supply OFF — circuit de-energized.';
  else if (S_.fuseBlown) st = 'F1 blown — no control power past the fuse.';
  else if (S_.olTripped) st = 'Overload tripped — 95/96 open. Reset the OL.';
  else if (S_.crPicked && S_.mPicked) st = fl.seal ? 'Sealed in — CR holding through 13/14, M energized, motor running.' : 'Running, but held only by the START button.';
  else if (S_.crPicked) st = 'CR is in but M is not — look at 23/24 and the M coil.';
  else st = 'Ready — 24 V is waiting at START 13.';
  $('status').textContent = st;
  $('log').innerHTML = logLines.map(l => `<div>${l}</div>`).join('');

  renderMeter(r);
}

/* ---------- operator actions ---------- */
function resetOL() {
  if (!S_.olTripped) return;
  S_.olTripped = false; log('Overload reset — 95/96 closed.'); update();
}
function tripOL() {
  if (S_.olTripped) return;
  S_.olTripped = true; log('Overload TRIPPED — 95/96 open.'); update();
}
function replaceFuse() {
  if (!S_.fuseBlown) return;
  S_.fuseBlown = false; log('F1 replaced.'); update();
}
function clearFaults() { for (const k in S_.faults) S_.faults[k] = false; }

const holdT = {}, relT = {};
function press(key) {
  clearTimeout(relT[key]);
  if (!S_[key]) { S_[key] = true; holdT[key] = performance.now(); update(); }
}
function release(key) {
  if (!S_[key]) return;
  const wait = Math.max(0, MIN_HOLD - (performance.now() - holdT[key]));
  clearTimeout(relT[key]);
  relT[key] = setTimeout(() => { S_[key] = false; update(); }, wait);
}
function bindMomentary(el, key) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); press(key); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, () => release(key)));
  el.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(key); } });
  el.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(key); });
}

function buildPanel() {
  bindMomentary($('btnStart'), 'startPressed');
  bindMomentary($('btnStop'), 'stopPressed');
  $('btnReset').onclick = resetOL; $('btnTrip').onclick = tripOL; $('btnFuse').onclick = replaceFuse;
  $('swPower').onchange = e => { S_.power = e.target.checked; log(S_.power ? '24 V supply ON.' : '24 V supply OFF.'); update(); };
  $('faults').innerHTML = Object.keys(FAULTS).map(k =>
    `<label data-tip="${FAULTS[k].sym}"><input type="checkbox" data-f="${k}">${FAULTS[k].label}</label>`).join('');
  $('faults').addEventListener('change', e => {
    const k = e.target.dataset.f; if (!k) return;
    S_.faults[k] = e.target.checked;
    log((e.target.checked ? 'Fault injected: ' : 'Fault cleared: ') + FAULTS[k].label + '.');
    update();
  });
  $('btnClear').onclick = () => { clearFaults(); log('All faults cleared.'); update(); };

  const typing = e => /INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
  document.addEventListener('keydown', e => {
    if (typing(e) || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 's') press('startPressed'); else if (k === 'x') press('stopPressed');
    else if (k === 'r') resetOL(); else if (k === 'p') { S_.power = !S_.power; update(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 's') release('startPressed'); else if (k === 'x') release('stopPressed');
  });
}

/* ---------- multimeter ---------- */
function placeLead(id) {
  if (meter.mode === 'V') { meter[meter.next] = id; meter.next = 'red'; }
  else { meter[meter.next] = id; meter.next = meter.next === 'red' ? 'black' : 'red'; }
  renderMeter(lastR);
}
function setMode(m) {
  meter.mode = m; meter.next = 'red';
  if (m === 'V') { if (!meter.black) meter.black = 'TPN'; } else { meter.red = meter.black = null; }
  renderMeter(lastR);
}
function renderMeter(r) {
  const a = TERMS[meter.red], b = TERMS[meter.black];
  const big = $('lcdBig'), unit = $('lcdUnit'), hint = $('meterHint');
  big.classList.remove('warn');
  $('modeV').classList.toggle('sel', meter.mode === 'V');
  $('modeC').classList.toggle('sel', meter.mode === 'C');
  $('moveBlack').classList.toggle('sel', meter.next === 'black');
  $('leads').innerHTML = `<b class="r">RED</b> ${a ? a.name : '—'} &nbsp; <b class="k">BLACK</b> ${b ? b.name : '—'}`;
  [['probeRed', a], ['probeBlack', b]].forEach(([k, t]) => {
    ui[k].classList.toggle('on', !!t);
    if (t) { ui[k].setAttribute('cx', t.x); ui[k].setAttribute('cy', t.y); }
  });

  if (meter.mode === 'V') {
    unit.textContent = 'V DC';
    if (!a) { big.textContent = '– – –'; hint.textContent = 'Click any terminal on the schematic to place the red lead.'; return; }
    const va = r.V[a.node], vb = r.V[b.node], floating = va === null || vb === null;
    const v = floating ? 0 : va - vb;
    big.textContent = (v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
    if (!S_.power) hint.textContent = 'Supply is off — everything reads 0 V.';
    else if (floating) hint.textContent = 'No reference: one lead is on a conductor that is not connected to either rail.';
    else if (b.node === 'N') hint.textContent = v >= 12
      ? 'Voltage is present here, so every device between this point and the 24 V+ rail is closed.'
      : 'No voltage here. Either something upstream is open, or you are on the return side of the load. Work back toward 24 V+ until you find 24 V.';
    else hint.textContent = Math.abs(v) >= 12
      ? 'Full voltage across these two points: the device between them is open (or it is the load doing its job).'
      : 'About 0 V across these points: they are at the same potential — a closed contact, or both dead.';
  } else {
    unit.textContent = 'Ω  continuity';
    if (!a || !b) { big.textContent = '– – –'; hint.textContent = 'Click two terminals: first the red lead, then the black lead.'; return; }
    if (S_.power) {
      big.textContent = 'LIVE'; big.classList.add('warn');
      hint.textContent = 'Never check continuity on an energized circuit. Switch the 24 V supply OFF first.';
      return;
    }
    const ohms = Sim.continuity(a.node, b.node);
    if (ohms === Infinity) { big.textContent = 'OL'; hint.textContent = 'OPEN — no path between the leads.'; }
    else if (ohms < 5) { big.textContent = '0.2'; hint.textContent = 'CLOSED — continuity (beep).'; }
    else { big.textContent = ohms.toFixed(0); hint.textContent = 'Reading through a coil — a healthy coil shows its winding resistance, not a short and not OL.'; }
  }
}
function buildMeter() {
  $('modeV').onclick = () => setMode('V');
  $('modeC').onclick = () => setMode('C');
  $('moveBlack').onclick = () => { meter.next = meter.next === 'black' ? 'red' : 'black'; renderMeter(lastR); };
  $('blackCom').onclick = () => { meter.black = 'TPN'; meter.next = 'red'; renderMeter(lastR); };
}

/* ---------- highlight helpers ---------- */
function highlight(cls, ids) {
  svg.querySelectorAll('.' + cls).forEach(e => e.classList.remove(cls));
  (ids || []).forEach(id => { const e = $(id); if (e) e.classList.add(cls); });
}

/* ---------- tab: finger trace ---------- */
let traceIdx = 0;
function renderTrace() {
  $('pane_trace').innerHTML =
    `<div class="nav"><button class="btn" id="trPrev">◀ Prev</button><button class="btn primary" id="trNext">Next ▶</button>
       <span class="sp">step ${traceIdx + 1} / ${TRACE_STEPS.length}</span></div>
     <ol class="steps">${TRACE_STEPS.map((s, i) =>
       `<li data-i="${i}" class="${i === traceIdx ? 'sel' : ''}"><b>${s.t}</b><p>${s.b}</p><p class="try">Try it: ${s.try}</p></li>`).join('')}</ol>`;
  $('trPrev').onclick = () => { traceIdx = (traceIdx + TRACE_STEPS.length - 1) % TRACE_STEPS.length; renderTrace(); };
  $('trNext').onclick = () => { traceIdx = (traceIdx + 1) % TRACE_STEPS.length; renderTrace(); };
  $('pane_trace').querySelectorAll('li').forEach(li => li.onclick = () => { traceIdx = +li.dataset.i; renderTrace(); });
  highlight('trace', TRACE_STEPS[traceIdx].hl);
}

/* ---------- tab: what-if ---------- */
const quiz = { open: -1, picked: {}, solved: new Set(), msg: '' };
function loadCondition(key) {          // put the simulator into the state described by an ANSWERS key
  endMystery(); clearFaults();
  S_.olTripped = false; S_.fuseBlown = false; S_.power = true;
  if (key === 'olTrip') S_.olTripped = true;
  else if (key === 'fuse') S_.fuseBlown = true;
  else S_.faults[key] = true;
  log('Loaded: ' + ANSWERS[key].label + '.');
  update();
}
function startMystery() {
  clearFaults(); S_.olTripped = false; S_.fuseBlown = false; S_.power = true;
  mystery = MYSTERY_POOL[Math.floor(Math.random() * MYSTERY_POOL.length)];
  S_.faults[mystery] = true;
  quiz.msg = ''; highlight('culprit', []);
  log('Mystery fault injected. Operate the circuit and find it with the meter.');
  update(); renderWhatIf();
}
function endMystery() { mystery = null; }
function renderWhatIf() {
  const p = $('pane_whatif');
  p.innerHTML =
    `<div class="myst"><b>Mystery fault challenge</b>

       <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
         <button class="btn primary" id="myStart">${mystery ? 'New mystery fault' : 'Inject mystery fault'}</button>

    SCENARIOS.map((s, i) => {
      const pick = quiz.picked[i], right = pick === s.answer;

        <button data-open="${i}">${i + 1}. ${s.title}</button>
        <div class="in"><p class="clue">${s.clue}</p>
          <div class="opts">${s.options.map(o =>
            `<button class="btn ${pick === o ? (right ? 'ok' : 'no') : ''}" data-s="${i}" data-o="${o}">${ANSWERS[o].label}</button>`).join('')}</div>
          <div class="fb ${pick ? (right ? 'ok' : 'no') : ''}">${!pick ? '' : right
            ? '<b>Correct.</b> ' + s.why
            : '<b>Not this one.</b> ' + ANSWERS[pick].sym + ' Compare that with the symptom and try again.'}</div>
          <button class="btn" data-load="${i}">Load this fault into the simulator</button>
        </div></div>`;
    }).join('');

  $('myStart').onclick = startMystery;
  if (mystery) {
    $('myCheck').onclick = () => {
      const v = $('mySel').value; if (!v) return;
      if (v === mystery) {
        quiz.msg = '<b>Correct — ' + FAULTS[v].label + '.</b> ' + FAULTS[v].sym; quiz.msgCls = 'ok';
        const comp = FAULTS[v].comp; endMystery(); update(); highlight('culprit', [comp]);
      } else { quiz.msg = '<b>Not it.</b> ' + FAULTS[v].sym + ' Does that match what you measured?'; quiz.msgCls = 'no'; }
      renderWhatIf();
    };
    $('myReveal').onclick = () => {
      const k = mystery; quiz.msg = 'It was: <b>' + FAULTS[k].label + '.</b> ' + FAULTS[k].sym; quiz.msgCls = 'no';
      endMystery(); update(); highlight('culprit', [FAULTS[k].comp]); renderWhatIf();
    };
  }
  p.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    quiz.open = quiz.open === +b.dataset.open ? -1 : +b.dataset.open; highlight('culprit', []); renderWhatIf();
  });
  p.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const i = +b.dataset.s, o = b.dataset.o;
    quiz.picked[i] = o;
    if (o === SCENARIOS[i].answer) { quiz.solved.add(i); highlight('culprit', [ANSWERS[o].comp]); } else highlight('culprit', []);
    renderWhatIf();
  });
  p.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { loadCondition(SCENARIOS[+b.dataset.load].answer); renderWhatIf(); });
}

/* ---------- tab: blindfold terminal map ---------- */
const tmap = { blind: false, checked: false };
function renderMap() {
  const p = $('pane_map');
  p.innerHTML =
    `<div class="nav">
       <button class="btn primary" id="tmBlind">${tmap.blind ? 'Show answers (study)' : 'Blindfold me'}</button>
       ${tmap.blind ? '<button class="btn" id="tmCheck">Check</button>' : ''}
       <label class="switch" style="font-weight:500;font-size:12.5px"><input type="checkbox" id="tmHide" ${svg.classList.contains('hidenums') ? 'checked' : ''}>Hide numbers on schematic</label>
       <span class="sp" id="tmScore"></span>
     </div>
     <table class="tm"><tr><th>Device</th><th>Type</th><th>Terminals</th></tr>${TERMMAP.map((r, i) =>
       `<tr><td>${r.dev}<div class="note">${tmap.blind ? '' : r.note}</div></td><td><span class="tag">${r.type}</span></td>
        <td>${r.ans.map((a, j) => tmap.blind
          ? `<input data-r="${i}" data-j="${j}" maxlength="3" autocomplete="off" spellcheck="false">`
          : `<span class="num">${a}</span>`).join('')}</td></tr>`).join('')}</table>
     <ul class="rules">
       <li><b>Last digit = function.</b> 1–2 is NC, 3–4 is NO. 5–6 / 7–8 are NC / NO with a special function (overload, timed).</li>
       <li><b>First digit = position.</b> 13/14 is the first pole, 23/24 the second, and so on. Overload contacts use 9: 95/96 NC, 97/98 NO.</li>
       <li><b>Coils are A1 / A2.</b> On DC, A1 is positive; the diode cathode follows A1.</li>
       <li><b>NEMA three-wire:</b> wires 1, 2, 3 — the seal-in contact always lands on 2 and 3.</li>
     </ul>`;
  $('tmBlind').onclick = () => { tmap.blind = !tmap.blind; renderMap(); };
  $('tmHide').onchange = e => svg.classList.toggle('hidenums', e.target.checked);
  if (tmap.blind) $('tmCheck').onclick = () => {
    let ok = 0, n = 0;
    p.querySelectorAll('input[data-r]').forEach(inp => {
      const good = inp.value.trim().toUpperCase() === TERMMAP[+inp.dataset.r].ans[+inp.dataset.j];
      inp.classList.toggle('ok', good); inp.classList.toggle('no', !good); n++; if (good) ok++;
    });
    $('tmScore').textContent = `${ok} / ${n} correct`;
  };
}

/* ---------- tabs + tooltip ---------- */
function buildTabs() {
  $('tabs').addEventListener('click', e => {
    const t = e.target.dataset.tab; if (!t) return;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('sel', b.dataset.tab === t));
    document.querySelectorAll('.pane').forEach(pn => pn.classList.toggle('sel', pn.id === 'pane_' + t));
    highlight('trace', t === 'trace' ? TRACE_STEPS[traceIdx].hl : []);
    highlight('culprit', []);
  });
  renderTrace(); renderWhatIf(); renderMap();
}
function buildTooltip() {
  const tip = $('tip');
  document.addEventListener('mousemove', e => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!t) { tip.classList.remove('show'); return; }
    // don't leak terminal numbers through the tooltip while they are hidden
    tip.textContent = t.dataset.term && svg.classList.contains('hidenums') ? 'Terminal — click to place a meter lead' : t.dataset.tip;
    tip.classList.add('show');
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px';
    tip.style.top = (e.clientY + 18 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 18) + 'px';
  });
}

buildSchematic(); buildPanel(); buildMeter(); buildTabs(); buildTooltip();
update();
})();
</script>
</body>
